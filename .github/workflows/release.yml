name: Release

# Push a tag such as v0.1.1 to publish that version to Maven Central.
# The tag must match `version` in pngine/build.gradle.kts.
#
# Run it by hand from the Actions tab for a dry run: it tests, signs and
# uploads the current version to the Central Portal but does not release
# it. Drop the deployment in the portal afterwards.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Never run two releases at once.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # macOS is required: the iOS artifacts can only be built there, and
    # publishing without them would ship a release iOS consumers cannot use.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches project version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pngine/build.gradle.kts)
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pngine/build.gradle.kts"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Test all targets
        run: ./gradlew :pngine:allTests

      - name: Publish to Maven Central
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            task=publishAndReleaseToMavenCentral
          else
            # Dry run: upload only, left for review in the portal.
            task=publishToMavenCentral
          fi
          ./gradlew ":pngine:$task" --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
