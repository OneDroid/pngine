site_name: Pngine
site_description: PNG-8 encoder for Kotlin Multiplatform, in pure Kotlin.
site_url: https://onedroid.github.io/pngine/
repo_url: https://github.com/OneDroid/pngine
repo_name: OneDroid/pngine
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 OneDroid — Apache-2.0

theme:
  name: material
  icon:
    logo: material/image-size-select-small
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Usage: usage.md
      - Platforms: platforms.md
  - Reference:
      - Options: options.md
      - How it works: how-it-works.md
      - DEFLATE: deflate.md
  - Project:
      - Sample app: sample.md
      - Testing: testing.md
      - Roadmap: roadmap.md
      - Prior art: prior-art.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/OneDroid/pngine
